name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel in-progress runs for the same branch/PR when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Keeps pip from writing to the home directory during caching
  PIP_NO_CACHE_DIR: "false"

# ---------------------------------------------------------------------------
# Job 1 — Lint (fast, no geo deps, runs first)
# ---------------------------------------------------------------------------
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-pip-${{ hashFiles('requirements.txt') }}

      # Install only ruff — no need for the full geo stack
      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: ruff check (linter)
        run: ruff check .

      - name: ruff format --check (formatter)
        run: ruff format --check .

# ---------------------------------------------------------------------------
# Job 2 — Unit tests (no GDAL, runs in parallel with lint)
# ---------------------------------------------------------------------------
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # Unit tests are fast and don't need geo deps; run in parallel with lint
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: unit-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python deps (without geo stack for speed)
        run: |
          pip install \
            fastapi==0.115.5 \
            uvicorn==0.32.1 \
            pydantic==2.10.3 \
            pydantic-settings==2.6.1 \
            sqlalchemy==2.0.36 \
            aiosqlite==0.20.0 \
            shapely==2.0.6 \
            pyproj==3.7.0 \
            pytest==8.3.4 \
            pytest-asyncio==0.24.0 \
            pytest-cov==6.0.0 \
            httpx==0.28.1 \
            anyio[trio]==4.7.0 \
            numpy

      - name: Run unit tests (no coverage threshold)
        run: |
          pytest tests/ \
            --ignore=tests/test_integration.py \
            --ignore=tests/conftest_integration.py \
            --tb=short \
            --no-cov \
            -q
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          UPLOAD_DIR: /tmp/geo_uploads

# ---------------------------------------------------------------------------
# Job 3 — Integration tests (needs full geo stack, runs after lint)
# ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests (full geo stack)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: integ-pip-${{ hashFiles('requirements.txt') }}

      - name: Install GDAL system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run integration tests with coverage
        run: |
          pytest tests/test_integration.py \
            --tb=short \
            --cov=app \
            --cov-report=xml:coverage-integration.xml \
            --cov-branch \
            -q
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          UPLOAD_DIR: /tmp/geo_uploads

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml
          retention-days: 7

# ---------------------------------------------------------------------------
# Job 4 — Full test suite with coverage gate (needs lint + unit tests pass)
# ---------------------------------------------------------------------------
  test-all:
    name: Full test suite + coverage gate
    runs-on: ubuntu-latest
    needs: [lint, test-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: all-pip-${{ hashFiles('requirements.txt') }}

      - name: Install GDAL system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run full suite with branch coverage
        run: pytest --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          UPLOAD_DIR: /tmp/geo_uploads

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/
          retention-days: 14

      - name: Upload coverage XML (for third-party tools, e.g. Codecov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

# ---------------------------------------------------------------------------
# Job 5 — Docker build (runs only after the full test suite passes)
# ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test-all

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (multi-stage, cache layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: false
          tags: geo-measure-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
